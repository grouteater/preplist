<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prep List</title>
  <meta name="description" content="Weekly meal prep and grocery shopping">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prep List">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="views">
    <section class="view" id="view-week"></section>
    <section class="view" id="view-shop"></section>
    <section class="view" id="view-prep"></section>
    <section class="view" id="view-meals"></section>
    <section class="view" id="view-more"></section>
  </main>

  <header class="nav" id="nav">
    <div class="nav-inner">
      <div class="nav-side left" id="nav-left"></div>
      <div class="nav-title" id="nav-title"></div>
      <div class="nav-side right" id="nav-right"></div>
    </div>
  </header>

  <div id="timerbar" class="timerbar hidden" aria-live="polite"></div>
  <div id="pricebar" class="pricebar hidden"></div>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="week" aria-label="Week">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="5" y="6" width="18" height="17" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11h18M10 3.5v5M18 3.5v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="16" r="1.4" fill="currentColor"/><circle cx="14" cy="16" r="1.4" fill="currentColor"/><circle cx="18" cy="16" r="1.4" fill="currentColor"/></svg>
      <span>Week</span>
    </button>
    <button class="tab" data-tab="shop" aria-label="Shop">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3.5 5h3l2.6 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 1.9-1.5L24 9H8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11.5" cy="23" r="1.8" fill="currentColor"/><circle cx="19.5" cy="23" r="1.8" fill="currentColor"/></svg>
      <span>Shop</span>
    </button>
    <button class="tab" data-tab="prep" aria-label="Prep">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 13h18v5a5 5 0 0 1-5 5h-8a5 5 0 0 1-5-5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 13h22M11 9c0-2 2-2 2-4M16 9c0-2 2-2 2-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      <span>Prep</span>
    </button>
    <button class="tab" data-tab="meals" aria-label="Meals">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M8 4.5h12a1.5 1.5 0 0 1 1.5 1.5v18l-7.5-5-7.5 5V6A1.5 1.5 0 0 1 8 4.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Meals</span>
    </button>
    <button class="tab" data-tab="more" aria-label="More">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="7" cy="14" r="2.2" fill="currentColor"/><circle cx="14" cy="14" r="2.2" fill="currentColor"/><circle cx="21" cy="14" r="2.2" fill="currentColor"/></svg>
      <span>More</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="receipt-file" accept="image/*" class="hidden">

  <script type="module" src="js/app.js"></script>
</body>
</html>
